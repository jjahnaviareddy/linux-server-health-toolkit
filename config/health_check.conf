# =============================================================================
# health_check.conf
# Central configuration for the Linux Server Health Check Toolkit.
# Edit the values below to match your environment.
# =============================================================================

# ---- Disk usage thresholds (percent used) ----
DISK_WARN_THRESHOLD=75
DISK_CRIT_THRESHOLD=90

# ---- Memory usage thresholds (percent used) ----
MEM_WARN_THRESHOLD=80
MEM_CRIT_THRESHOLD=95

# ---- Swap usage threshold (percent used) ----
SWAP_WARN_THRESHOLD=50

# ---- Services to monitor (space-separated systemd unit names) ----
# Edit this list to match the services running on your server.
SERVICES_TO_CHECK="ssh cron"

# ---- Directories (resolved relative to project root, do not hardcode) ----
BASE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
LOG_DIR="${BASE_DIR}/logs"
DATA_DIR="${LOG_DIR}/data"
REPORT_DIR="${BASE_DIR}/reports"

# ---- Log rotation settings ----
# LOG_ROTATE_TARGET_DIR can point at a system log directory (e.g. /var/log/myapp)
# in addition to the toolkit's own logs. Leave blank to only rotate the
# toolkit's own logs.
LOG_ROTATE_TARGET_DIR=""
LOG_ROTATE_MAX_AGE_DAYS=7
LOG_ROTATE_COMPRESS=true

# CPU usage thresholds (%)
CPU_WARN_THRESHOLD=80
CPU_CRIT_THRESHOLD=95
